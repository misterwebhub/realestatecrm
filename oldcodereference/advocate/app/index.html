<!DOCTYPE html>
<html>
<head>
  <title>Call Soft</title>
  <link rel="stylesheet" href="site.css">
	<script type="text/javascript">
 
		   var url_string = window.location.href;
var url = new URL(url_string);
var c = url.searchParams.get("mobile");
      // s
		//alert(c);
     // document.getElementById("phone-number").value=c;
		$(document).ready({
			function()
			{
				document.getElementByID("phone-number").value=""+c;
			}
		});
		
    </script>
</head>
<body>
  <div id="controls">
    <div id="info">
      <p class="instructions">Call To Client</p>
      <div id="client-name"></div>
      <div id="output-selection">
        <label>Ringtone Devices</label>
        <select id="ringtone-devices" multiple></select>
        <label>Speaker Devices</label>
        <select id="speaker-devices" multiple></select><br/>
        <a id="get-devices">Seeing unknown devices?</a>
      </div>
    </div>
    <div id="call-controls">
      <p class="instructions">Make a Call:</p>
      <input id="phone-number" type="text" placeholder="Enter a phone # or client name"  class="rt"/>
      <button id="button-call">Call</button>
      <button id="button-hangup">Hangup</button>
      <div id="volume-indicators">
        <label>Mic Volume</label>
        <div id="input-volume"></div><br/><br/>
        <label>Speaker Volume</label>
        <div id="output-volume"></div>
      </div>
    </div>
    <div id="log"></div>
  </div>

  <script type="text/javascript"
  src="twilio.js"></script>  <script src="jquery.min.js"></script>
  <script src="quickstart.js"></script>
</body>
</html>
